[project]
name = "teamtrack-backend"
version = "0.1.0"
description = "TeamTrack AI - weekly goals, daily work updates and AI weekly reports"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "sqlalchemy>=2.0",
    "alembic>=1.13",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "pyjwt>=2.8",
    "pwdlib[argon2]>=0.2",
    "anthropic>=0.60",
    "apscheduler>=3.10,<4",
    "openpyxl>=3.1",
    "fpdf2>=2.7",
    "psycopg[binary]>=3.1",
    "groq>=1.7.0",
]

[dependency-groups]
dev = ["pytest>=8", "httpx>=0.27"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
